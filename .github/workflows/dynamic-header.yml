
name: Update Dynamic Header Banner

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-banner:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Update header based on IST
        run: |
          export TZ="Asia/Kolkata"
          hour=$(date +%H)

          mkdir -p assets

          if (( hour >= 6 && hour < 18 )); then
            cp assets/day.gif assets/dynamic-header.gif
          else
            magick assets/night.jpg assets/dynamic-header.gif
          fi

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update dynamic header"
          file_pattern: assets/dynamic-header.gif
